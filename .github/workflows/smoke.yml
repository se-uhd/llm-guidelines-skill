name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Bundle consistency smoke
        run: python3 scripts/tests/run_smoke.py
      - name: Markdown linter smoke
        run: python3 plugins/llm-guidelines/skills/llm-guidelines/scripts/tests/run_smoke.py
